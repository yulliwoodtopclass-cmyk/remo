<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team REMO Workspace</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background-color: #ff5722; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .chat-container { width: 90%; max-width: 600px; background: white; margin-top: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; height: 60vh; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
        .message-item { margin-bottom: 10px; line-height: 1.4; }
        .message-item strong { color: #ff5722; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 14px; }
        button { background-color: #ff5722; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        button:hover { background-color: #e64a19; }
    </style>
</head>
<body>

    <header>Team REMO Workspace</header>

    <div class="chat-container">
        <div class="messages" id="messages-box">
            <!-- 메시지가 여기에 표시됩니다 -->
        </div>
        <div class="input-area">
            <input type="text" id="username" placeholder="이름 (예: 유진)" style="flex: 0.3;">
            <input type="text" id="message" placeholder="메시지를 입력하세요...">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        const messagesBox = document.getElementById('messages-box');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('message');

        // 서버에서 메시지 불러오기
        async function fetchMessages() {
            try {
                const response = await fetch('/api/chat');
                const data = await response.json();
                messagesBox.innerHTML = '';
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message-item';
                    // Neon DB 시간은 약간 다를 수 있어 깔끔하게 이름과 내용만 표시
                    div.innerHTML = `<strong>${msg.username}:</strong> ${msg.text}`;
                    messagesBox.appendChild(div);
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            } catch (error) {
                console.error("메시지 로딩 실패:", error);
            }
        }

        // 메시지 전송하기
        async function sendMessage() {
            const username = usernameInput.value.trim();
            const text = messageInput.value.trim();

            if (!username || !text) {
                alert('이름과 메시지를 모두 입력해주세요!');
                return;
            }

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, text })
                });
                messageInput.value = ''; // 입력창 비우기
                fetchMessages(); // 새로고침
            } catch (error) {
                console.error("메시지 전송 실패:", error);
                alert("전송에 실패했습니다.");
            }
        }

        // 엔터키로 전송
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 3초마다 새 메시지 확인
        setInterval(fetchMessages, 3000);
        // 첫 화면 로딩 시 메시지 가져오기
        fetchMessages();
    </script>

</body>
</html>
